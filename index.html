
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f1e8;
      color: #49382b;
      text-align: center;
      padding: 80px 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 40px 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px #0001;
    }

    button {
      background: #795548;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ยินดีต้อนรับ</h1>
    <p>นี่คือเว็บไซต์แรกของฉัน</p>
    <button onclick="alert('เว็บไซต์ทำงานแล้ว!')">
      คลิกที่นี่
    </button>
  </div>
</body>
</html>
